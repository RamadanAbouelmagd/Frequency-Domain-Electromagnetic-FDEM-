<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><style>:root{color-scheme:light dark}body{margin:0}</style></head><body><title>Route Driver</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@500;700;800&family=Overpass+Mono:wght@500;700&display=swap">
<style>
/* Layout: one screen, thumb-reachable. Road-sign green instruction card on top,
   rotated close-up of the intersection in the middle (your approach always points up),
   BACK / NEXT at the bottom. Type: Overpass (Highway Gothic descendant) + Overpass Mono. */
:root {
  --bg: #eceee9; --panel: #ffffff; --ink: #141a17; --muted: #55625a; --line: #c9d1c9;
  --sign: #0b6a44; --sign-ink: #ffffff; --route: #1565c0; --collect: #14903f; --drive: #b87800;
  --warn: #c62828; --map-bg: #f7f8f4; --bgline: #c3cbc2; --next: #1565c0; --btn: #141a17; --btn-ink: #ffffff;
  --font: "Overpass", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --mono: "Overpass Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1210; --panel: #17201b; --ink: #edf2ee; --muted: #9db0a4; --line: #2a362f;
    --sign: #0b5a3a; --route: #6db3ff; --collect: #3ddc84; --drive: #ffc233;
    --warn: #ff8080; --map-bg: #111915; --bgline: #2c3931; --next: #6db3ff; --btn: #edf2ee; --btn-ink: #0d1210;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1210; --panel: #17201b; --ink: #edf2ee; --muted: #9db0a4; --line: #2a362f;
  --sign: #0b5a3a; --route: #6db3ff; --collect: #3ddc84; --drive: #ffc233;
  --warn: #ff8080; --map-bg: #111915; --bgline: #2c3931; --next: #6db3ff; --btn: #edf2ee; --btn-ink: #0d1210;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; }
.app {
  box-sizing: border-box; height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--route); outline-offset: 2px; }

.top { display: flex; align-items: center; gap: 10px; min-width: 0; }
.top .name { flex: 1; min-width: 0; font-weight: 700; font-size: 14px; letter-spacing: .02em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { font-family: var(--mono); font-weight: 700; font-size: 12px; padding: 5px 9px; border-radius: 999px;
  border: 1.5px solid var(--line); background: var(--panel); white-space: nowrap; }
.chip.ok { border-color: var(--collect); color: var(--collect); }
.chip.bad { border-color: var(--warn); color: var(--warn); }
button.chip { cursor: pointer; }
.prog { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.prog > i { display: block; height: 100%; width: 0; background: var(--route); transition: width .25s; }
.counts { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; color: var(--muted); }

.sign { position: relative; display: grid; grid-template-columns: 84px 1fr; gap: 14px; align-items: center;
  background: var(--sign); color: var(--sign-ink); border-radius: 14px; padding: 14px 16px; min-width: 0; }
.sign::after { content: ""; position: absolute; inset: 5px; border: 2px solid rgba(255,255,255,.85);
  border-radius: 10px; pointer-events: none; }
.sign svg { width: 84px; height: 84px; display: block; }
.sign .txt { min-width: 0; }
.verb { font-weight: 800; font-size: clamp(18px, 5.4vw, 24px); letter-spacing: .06em; text-transform: uppercase; line-height: 1.1; }
.street { font-weight: 800; font-size: clamp(26px, 8.6vw, 38px); line-height: 1.04; margin-top: 3px; overflow-wrap: anywhere;
  text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
.dist { font-family: var(--mono); font-weight: 700; font-size: 20px; }
.badge { font-weight: 800; font-size: 13px; letter-spacing: .08em; padding: 3px 9px; border-radius: 6px; color: #fff; }
.badge.collect { background: #14903f; }
.badge.drive { background: #b87800; }
.warn { background: var(--warn); color: #fff; border-radius: 10px; padding: 8px 12px; font-weight: 700; font-size: 15px; }

.map { flex: 1; min-height: 150px; position: relative; border-radius: 14px; overflow: hidden;
  background: var(--map-bg); border: 1.5px solid var(--line); }
.map svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.map text { font-family: var(--font); font-weight: 700; font-size: 11px; fill: var(--ink);
  paint-order: stroke; stroke: var(--map-bg); stroke-width: 3.5px; stroke-linejoin: round; }

.then { display: flex; align-items: center; gap: 10px; min-width: 0; padding: 8px 12px; background: var(--panel);
  border: 1.5px solid var(--line); border-radius: 12px; }
.then .lab { font-family: var(--mono); font-weight: 700; font-size: 12px; color: var(--muted); letter-spacing: .08em; }
.then svg { width: 30px; height: 30px; flex: none; color: var(--next); }
.then .t { min-width: 0; font-weight: 700; font-size: 16px; line-height: 1.15; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }

.ctrl { display: grid; grid-template-columns: 1fr 2.2fr; gap: 10px; }
.big { height: 66px; border-radius: 14px; border: 0; font-weight: 800; font-size: 22px; letter-spacing: .08em; }
.big.back { background: var(--panel); border: 2px solid var(--line); }
.big.next { background: var(--btn); color: var(--btn-ink); }
.big:active { transform: scale(.98); }
.small { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.small button { height: 44px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--panel);
  font-weight: 700; font-size: 14px; }
.small button[aria-pressed="true"] { border-color: var(--route); color: var(--route); }

.sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sheet header { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; gap: 10px; }
.sheet h2 { margin: 0; font-size: 20px; font-weight: 800; }
.sheet .close { height: 44px; padding: 0 18px; border-radius: 10px; border: 2px solid var(--line); background: var(--panel); font-weight: 800; }
.list { overflow-y: auto; flex: 1; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.row { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center; width: 100%; text-align: left;
  padding: 10px 6px; background: none; border: 0; border-bottom: 1px solid var(--line); min-width: 0; }
.row .n { font-family: var(--mono); font-weight: 700; color: var(--muted); }
.row .s { min-width: 0; }
.row .s b { display: block; font-size: 16px; overflow-wrap: anywhere; }
.row .s span { font-size: 13px; color: var(--muted); font-weight: 700; letter-spacing: .04em; }
.row .f { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.row.cur { background: color-mix(in srgb, var(--route) 14%, transparent); }
.row.done .s b { color: var(--muted); }
.row .m-c { color: var(--collect); } .row .m-d { color: var(--drive); }
.pick { display: block; width: 100%; text-align: left; padding: 14px; margin-bottom: 10px; border-radius: 12px;
  border: 2px solid var(--line); background: var(--panel); font-weight: 800; font-size: 18px; }
.grp { font-family: var(--mono); font-weight: 700; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 14px 0 8px; }
.pick small { display: block; font-weight: 500; color: var(--muted); font-size: 14px; margin-top: 2px; }
</style>

<div class="app" id="app">
  <div class="top">
    <div class="name" id="rname">Route</div>
    <button class="chip" id="gps" type="button">GPS: tap to enable</button>
    <button class="chip" id="chg" type="button" hidden>Routes</button>
  </div>
  <div>
    <div class="prog"><i id="bar"></i></div>
    <div class="counts"><span id="cnt">Step 1 / 1</span><span id="rem">0 mi left</span></div>
  </div>

  <section class="sign" aria-live="polite">
    <div id="arrow"></div>
    <div class="txt">
      <div class="verb" id="verb">START</div>
      <div class="street" id="street">Street</div>
      <div class="meta"><span class="dist" id="dist">0 ft</span><span class="badge" id="badge">DRIVE</span></div>
    </div>
  </section>
  <div class="warn" id="warn" hidden></div>
  <div class="warn" id="off" hidden></div>

  <section class="map" aria-label="Close-up of this intersection, your approach points up">
    <svg id="map" viewBox="0 0 360 300" preserveAspectRatio="xMidYMid meet"></svg>
  </section>

  <section class="then"><span class="lab">THEN</span><span id="thenArrow"></span><span class="t" id="thenText">-</span></section>

  <div class="ctrl">
    <button class="big back" id="back" type="button">BACK</button>
    <button class="big next" id="next" type="button">NEXT STEP</button>
  </div>
  <div class="small">
    <button id="bSteps" type="button">Steps</button>
    <button id="bNear" type="button">Nearest</button>
    <button id="bVoice" type="button" aria-pressed="false">Voice off</button>
    <button id="bDone" type="button">Restart</button>
  </div>
</div>

<div class="sheet" id="stepsSheet" hidden>
  <header><h2>All steps</h2><button class="close" id="stepsClose" type="button">Close</button></header>
  <div class="list" id="stepsList"></div>
</div>
<div class="sheet" id="routesSheet" hidden>
  <header><h2>Choose a route</h2><button class="close" id="routesClose" type="button">Close</button></header>
  <div class="list" id="routesList"></div>
</div>

  var ANG = { straight: 0, start: 0, slight_right: 45, right: 90, sharp_right: 135, slight_left: -45, left: -90, sharp_left: -135 };
  function verbOf(s) {
    if (s.turn === "roundabout" && s.exit) return "ROUNDABOUT, EXIT " + s.exit;
    return VERB[s.turn] || "CONTINUE";
  }
  function fmtFt(ft) { return ft >= 1000 ? (ft / 5280).toFixed(2) + " mi" : Math.round(ft).toLocaleString() + " ft"; }

  function arrowSVG(turn) {
    var a = '<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
    if (turn === "uturn") {
      a += '<path d="M66 94V40A16 16 0 0 0 34 40V60"/><path d="M22 60L34 80L46 60Z" fill="currentColor"/>';
    } else if (turn === "roundabout") {
      a += '<path d="M50 94V72"/><circle cx="50" cy="50" r="22"/><path d="M50 28V14"/><path d="M36 22L50 4L64 22Z" fill="currentColor"/>';
    } else if (turn === "arrive") {
      a += '<path d="M30 92V12"/><path d="M30 14L80 30L30 48Z" fill="currentColor"/>';
    } else {
      var d = ANG[turn] || 0;
      a += '<path d="M50 94V58"/><g transform="rotate(' + d + ' 50 58)"><path d="M50 58V30"/><path d="M34 32L50 8L66 32Z" fill="currentColor"/></g>';
    }
    return a + "</svg>";
  }

  /* ---------- geometry ---------- */
  function hyp(x, y) { return Math.sqrt(x * x + y * y); }
  function dm(a, b) {
    var k = Math.cos(a[1] * Math.PI / 180);
    return hyp((a[0] - b[0]) * 111320 * k, (a[1] - b[1]) * 110574);
  }
  function distToLine(p, line) {
    var k = Math.cos(p[1] * Math.PI / 180), best = 1e12;
    for (var j = 0; j < line.length - 1; j++) {
      var ax = (line[j][0] - p[0]) * 111320 * k, ay = (line[j][1] - p[1]) * 110574;
      var bx = (line[j + 1][0] - p[0]) * 111320 * k, by = (line[j + 1][1] - p[1]) * 110574;
      var dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy, t = L ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / L)) : 0;
      var d = hyp(ax + t * dx, ay + t * dy);
      if (d < best) best = d;
    }
    if (line.length === 1) best = dm(p, line[0]);
    return best;
  }
  function clipLen(pts, maxM, fromEnd) {
    var a = fromEnd ? pts.slice().reverse() : pts, out = [a[0]], run = 0;
    for (var j = 1; j < a.length; j++) {
      var d = hyp(a[j].x - a[j - 1].x, a[j].y - a[j - 1].y);
      if (run + d > maxM) {
        var t = (maxM - run) / d;
        out.push({ x: a[j - 1].x + (a[j].x - a[j - 1].x) * t, y: a[j - 1].y + (a[j].y - a[j - 1].y) * t });
        run = maxM; break;
      }
      out.push(a[j]); run += d;
    }
    return { pts: fromEnd ? out.reverse() : out, cut: run >= maxM };
  }

  /* ---------- map close-up (rotated so the approach heading points up) ---------- */
  var SVGNS = "http://www.w3.org/2000/svg";
  function el(name, attrs, parent) {
    var e = document.createElementNS(SVGNS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function poly(pts) { return pts.map(function (p) { return p.sx.toFixed(1) + "," + p.sy.toFixed(1); }).join(" "); }

  function drawMap() {
    var svg = $("map"); svg.textContent = "";
    var W = svg.clientWidth || 360, H = svg.clientHeight || 300, pad = 34;
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    var s = steps[i], cur = s.coords, prev = i > 0 ? steps[i - 1].coords : null, nxt = i < steps.length - 1 ? steps[i + 1].coords : null;
    var o = cur[0], k = Math.cos(o[1] * Math.PI / 180);
    var P = function (c) { return { x: (c[0] - o[0]) * 111320 * k, y: (c[1] - o[1]) * 110574 }; };
    var cp = cur.map(P), pp = prev ? prev.map(P) : null, np = nxt ? nxt.map(P) : null;
    var head = null, ref = pp || cp, end = pp ? pp[pp.length - 1] : cp[0], j;
    if (pp) { for (j = pp.length - 1; j >= 0; j--) if (hyp(pp[j].x - end.x, pp[j].y - end.y) > 8) { head = Math.atan2(end.y - pp[j].y, end.x - pp[j].x); break; } }
    if (head === null) { for (j = 1; j < cp.length; j++) if (hyp(cp[j].x, cp[j].y) > 8) { head = Math.atan2(cp[j].y, cp[j].x); break; } }
    if (head === null) head = Math.PI / 2;
    var rot = Math.PI / 2 - head, cr = Math.cos(rot), sr = Math.sin(rot);
    var T = function (p) { return { x: p.x * cr - p.y * sr, y: p.x * sr + p.y * cr }; };

    var cC = clipLen(cp, 420, false), pC = pp ? clipLen(pp, 140, true) : null, nC = np ? clipLen(np, 200, false) : null;
    var parts = [cC.pts.map(T)]; if (pC) parts.push(pC.pts.map(T)); if (nC) parts.push(nC.pts.map(T));
    var minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9;
    parts.forEach(function (a) { a.forEach(function (p) { minx = Math.min(minx, p.x); maxx = Math.max(maxx, p.x); miny = Math.min(miny, p.y); maxy = Math.max(maxy, p.y); }); });
    var cx = (minx + maxx) / 2, cy = (miny + maxy) / 2, w = Math.max(maxx - minx, 110), h = Math.max(maxy - miny, 110);
    var sc = Math.min((W - 2 * pad) / w, (H - 2 * pad) / h);
    var S = function (p) { var t = p.x !== undefined && p.sx === undefined ? p : p; return { sx: W / 2 + (t.x - cx) * sc, sy: H / 2 - (t.y - cy) * sc }; };

    /* background streets of the zone, faint, so you can see the cross streets */
    if (R.bg) {
      var half = Math.max(w, h) / 2 + 120, lonpad = half / (111320 * k), latpad = half / 110574;
      var rcx = o[0] + (cx * cr + cy * sr) / (111320 * k), rcy = o[1] + (-cx * sr + cy * cr) / 110574;
      var g = el("g", { fill: "none", stroke: "var(--bgline)", "stroke-width": 1.4, "stroke-linecap": "round", "stroke-linejoin": "round" }, svg);
      R.bg.forEach(function (b) {
        if (b.x1 < rcx - lonpad || b.x0 > rcx + lonpad || b.y1 < rcy - latpad || b.y0 > rcy + latpad) return;
        el("polyline", { points: poly(b.c.map(function (c) { return S(T(P(c))); })) }, g);
      });
    }
    var tr = function (a) { return a.map(function (p) { return S(T(p)); }); };
    if (pC) el("polyline", { points: poly(tr(pC.pts)), fill: "none", stroke: "var(--muted)", "stroke-width": 7, "stroke-linecap": "round", "stroke-linejoin": "round", opacity: .55 }, svg);
    if (nC) el("polyline", { points: poly(tr(nC.pts)), fill: "none", stroke: "var(--next)", "stroke-width": 6, "stroke-dasharray": "2 11", "stroke-linecap": "round", "stroke-linejoin": "round" }, svg);
    var col = s.mode === "COLLECT" ? "var(--collect)" : s.turn === "arrive" ? "var(--route)" : "var(--drive)";
    var cs = tr(cC.pts);
    el("polyline", { points: poly(cs), fill: "none", stroke: col, "stroke-width": 9, "stroke-linecap": "round", "stroke-linejoin": "round" }, svg);
    /* direction chevrons along the current leg */
    var acc = 0, nextAt = 28;
    for (j = 1; j < cs.length; j++) {
      var dx = cs[j].sx - cs[j - 1].sx, dy = cs[j].sy - cs[j - 1].sy, L = hyp(dx, dy), ang = Math.atan2(dy, dx) * 180 / Math.PI;
      while (acc + L >= nextAt) {
        var t = (nextAt - acc) / L, mx = cs[j - 1].sx + dx * t, my = cs[j - 1].sy + dy * t;
        el("path", { d: "M-5 -5L3 0L-5 5", transform: "translate(" + mx.toFixed(1) + " " + my.toFixed(1) + ") rotate(" + ang.toFixed(0) + ")",
          fill: "none", stroke: "#fff", "stroke-width": 2.6, "stroke-linecap": "round", "stroke-linejoin": "round" }, svg);
        nextAt += 46;
      }
      acc += L;
    }
    /* the intersection you turn at, and where this leg ends */
    var a0 = S(T(cp[0]));
    el("circle", { cx: a0.sx, cy: a0.sy, r: 10, fill: "var(--ink)" }, svg);
    el("circle", { cx: a0.sx, cy: a0.sy, r: 4.5, fill: "var(--map-bg)" }, svg);
    if (!cC.cut && cs.length > 1) {
      var z = cs[cs.length - 1];
      el("circle", { cx: z.sx, cy: z.sy, r: 7, fill: "var(--map-bg)", stroke: "var(--ink)", "stroke-width": 3 }, svg);
    }
    /* labels: street you came on, this street, street after */
    function label(txt, p, dx, dy) {
      if (txt.length > 24) txt = txt.slice(0, 23) + "...";
      var wpx = txt.length * 6.4, right = p.sx + dx + wpx > W - 6;
      var t = el("text", { x: right ? p.sx - dx : p.sx + dx, y: Math.max(14, Math.min(H - 6, p.sy + dy)), "text-anchor": right ? "end" : "start" }, svg);
      t.textContent = txt;
    }
    if (pC && i > 0) { var pa = tr(pC.pts)[0]; label(steps[i - 1].street, pa, 12, 4); }
    var mid = cs[Math.min(cs.length - 1, Math.floor(cs.length / 2))];
    label(s.street, mid, 12, -15);
    if (nC && nxt) { var na = tr(nC.pts), ne = na[na.length - 1]; label(steps[i + 1].street, ne, 10, 4); }
    /* north indicator */
    var ng = el("g", { transform: "translate(24 28) rotate(" + (rot * 180 / Math.PI).toFixed(0) + ")" }, svg);
    el("path", { d: "M0 -13L6 7L0 3L-6 7Z", fill: "var(--ink)" }, ng);
    var nt = el("text", { x: 0, y: -17, "text-anchor": "middle", transform: "rotate(" + (-(rot * 180 / Math.PI)).toFixed(0) + " 0 -17)" }, ng); nt.textContent = "N";
    /* you (GPS) */
    if (pos) {
      var up = S(T(P(pos)));
      if (up.sx > 0 && up.sx < W && up.sy > 0 && up.sy < H) {
        el("circle", { cx: up.sx, cy: up.sy, r: 16, fill: "var(--route)", opacity: .22 }, svg);
        el("circle", { cx: up.sx, cy: up.sy, r: 8, fill: "var(--route)", stroke: "#fff", "stroke-width": 3 }, svg);
      }
    }
  }

  /* ---------- render ---------- */
  function render(speak) {
    var s = steps[i], n = steps.length;
    $("rname").textContent = R.title;
    $("cnt").textContent = "Step " + (i + 1) + " / " + n;
    $("rem").textContent = (remFt[i] / 5280).toFixed(1) + " mi left";
    $("bar").style.width = (100 * i / Math.max(1, n - 1)).toFixed(1) + "%";
    $("arrow").innerHTML = arrowSVG(s.turn);
    $("verb").textContent = verbOf(s) + (s.turn === "start" || s.turn === "arrive" ? "" : " onto");
    if (s.turn === "start") $("verb").textContent = "START ON";
    if (s.turn === "arrive") $("verb").textContent = "ARRIVE";
    $("street").textContent = s.turn === "arrive" ? (s.street || "Destination") : s.street;
    $("dist").textContent = s.turn === "arrive" ? "" : fmtFt(s.ft);
    var b = $("badge"); b.textContent = s.mode === "COLLECT" ? "COLLECT" : s.mode === "DRIVE" ? "DRIVE" : "REPEAT - NO PICKUP";
    b.className = "badge " + (s.mode === "COLLECT" ? "collect" : "drive");
    b.hidden = s.turn === "arrive";
    var w = $("warn"); w.hidden = !s.warn; w.textContent = s.warn || "";
    var nx = steps[i + 1];
    $("thenArrow").innerHTML = nx ? arrowSVG(nx.turn) : "";
    $("thenText").textContent = nx ? verbOf(nx) + (nx.turn === "arrive" ? "" : " onto ") + (nx.turn === "arrive" ? "" : nx.street) + (nx.turn === "arrive" ? "" : "  -  " + fmtFt(nx.ft)) : "End of route";
    $("back").disabled = i === 0;
    $("back").style.opacity = i === 0 ? .4 : 1;
    $("next").textContent = i === n - 1 ? "FINISHED" : "NEXT STEP";
    drawMap();
    sset("drv:" + R.id, String(i));
    if (speak && voiceOn) say(s);
    checkOff();
  }
  function say(s) {
    try {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      var t = verbOf(s).toLowerCase() + (s.turn === "arrive" ? "" : " onto " + s.street + ". " + Math.round(s.ft) + " feet." + (s.mode === "COLLECT" ? " Collect." : ""));
      window.speechSynthesis.speak(new SpeechSynthesisUtterance(t));
    } catch (e) {}
  }
  function go(j, speak) { i = Math.max(0, Math.min(steps.length - 1, j)); render(speak !== false); }

  /* ---------- GPS ---------- */
  function setGps(txt, cls) { var g = $("gps"); g.textContent = txt; g.className = "chip " + (cls || ""); }
  function startGps() {
    if (!navigator.geolocation) { setGps("GPS unavailable: manual", "bad"); return; }
    if (watchId !== null) return;
    setGps("GPS: waiting...", "");
    try {
      watchId = navigator.geolocation.watchPosition(onPos, function (e) {
        watchId = null;
        setGps(e && e.code === 1 ? "GPS blocked: manual mode" : "GPS error: manual mode", "bad");
      }, { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
    } catch (e) { setGps("GPS blocked: manual mode", "bad"); }
  }
  function onPos(p) {
    pos = [p.coords.longitude, p.coords.latitude];
    setGps("GPS +/-" + Math.round(p.coords.accuracy) + " m", p.coords.accuracy < 40 ? "ok" : "");
    if (p.coords.accuracy < 60) {
      for (var j = i; j <= Math.min(steps.length - 1, i + 2); j++) {
        var c = steps[j].coords, e = c[c.length - 1];
        if (j < steps.length - 1 && dm(pos, e) < ADV_M) { i = j + 1; render(true); return; }
      }
    }
    drawMap(); checkOff();
  }
  function checkOff() {
    var o = $("off");
    if (!pos) { o.hidden = true; return; }
    var d = 1e12;
    for (var j = Math.max(0, i - 1); j <= Math.min(steps.length - 1, i + 1); j++) d = Math.min(d, distToLine(pos, steps[j].coords));
    if (d > OFF_M) { o.hidden = false; o.textContent = "Off route (" + Math.round(d * FT) + " ft). Tap Nearest to re-sync."; }
    else o.hidden = true;
  }
  function nearest() {
    if (!pos) { startGps(); return; }
    var best = -1, bd = 1e12, lo = Math.max(0, i - 3), hi = Math.min(steps.length - 1, i + 60), j, d;
    for (j = lo; j <= hi; j++) { d = distToLine(pos, steps[j].coords) + (j < i ? 15 : 0); if (d < bd) { bd = d; best = j; } }
    if (bd > 120) for (j = 0; j < steps.length; j++) { d = distToLine(pos, steps[j].coords); if (d < bd) { bd = d; best = j; } }
    if (best >= 0) go(best);
  }

  /* ---------- sheets ---------- */
  function buildSteps() {
    var L = $("stepsList"); L.textContent = "";
    steps.forEach(function (s, j) {
      var b = document.createElement("button"); b.type = "button"; b.className = "row" + (j === i ? " cur" : j < i ? " done" : ""); b.id = "row" + j;
      b.innerHTML = '<span class="n"></span><span class="s"><b></b><span></span></span><span class="f"></span>';
      b.querySelector(".n").textContent = j + 1;
      b.querySelector("b").textContent = s.street || "Destination";
      var sp = b.querySelector(".s span"); sp.textContent = verbOf(s) + " - " + (s.mode === "COLLECT" ? "COLLECT" : s.mode === "DRIVE" ? "DRIVE" : "REPEAT"); sp.className = s.mode === "COLLECT" ? "m-c" : "m-d";
      b.querySelector(".f").textContent = s.turn === "arrive" ? "" : fmtFt(s.ft);
      b.addEventListener("click", function () { $("stepsSheet").hidden = true; go(j); });
      L.appendChild(b);
    });
  }
  function openSteps() { buildSteps(); $("stepsSheet").hidden = false; var r = $("row" + i); if (r) r.scrollIntoView({ block: "center" }); }
  function buildRoutes() {
    var L = $("routesList"); L.textContent = "";
    var lastGroup = null;
    ROUTES.forEach(function (r, j) {
      if (r.group && r.group !== lastGroup) {
        var h = document.createElement("div"); h.className = "grp"; h.textContent = r.group; L.appendChild(h); lastGroup = r.group;
      }
      var b = document.createElement("button"); b.type = "button"; b.className = "pick";
      var mi = r.steps.reduce(function (a, s) { return a + s.ft; }, 0) / 5280;
      b.innerHTML = "<span></span><small></small>";
      b.querySelector("span").textContent = r.title;
      b.querySelector("small").textContent = r.steps.length + " steps - " + mi.toFixed(1) + " mi" + (r.note ? " - " + r.note : "");
      b.addEventListener("click", function () { $("routesSheet").hidden = true; openRoute(j); });
      L.appendChild(b);
    });
  }

  function openRoute(idx) {
    R = ROUTES[idx]; steps = R.steps; sset("drv:last", String(idx));
    if (R.bgKey && BGS[R.bgKey]) {
      if (!BGC[R.bgKey]) BGC[R.bgKey] = BGS[R.bgKey].map(function (c) {
        var x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
        c.forEach(function (p) { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); });
        return { c: c, x0: x0, x1: x1, y0: y0, y1: y1 };
      });
      R.bg = BGC[R.bgKey];
    }
    remFt = new Array(steps.length); var t = 0;
    for (var j = steps.length - 1; j >= 0; j--) { t += steps[j].ft; remFt[j] = t; }
    var saved = parseInt(sget("drv:" + R.id) || "0", 10);
    i = isNaN(saved) ? 0 : Math.max(0, Math.min(steps.length - 1, saved));
    render(false);
  }

  window.addEventListener("resize", function () { if (steps) drawMap(); });

  /* ---------- wiring ---------- */
  $("next").addEventListener("click", function () { go(i + 1); });
  $("back").addEventListener("click", function () { go(i - 1); });
  $("bSteps").addEventListener("click", openSteps);
  $("stepsClose").addEventListener("click", function () { $("stepsSheet").hidden = true; });
  $("routesClose").addEventListener("click", function () { $("routesSheet").hidden = true; });
  $("bNear").addEventListener("click", nearest);
  $("gps").addEventListener("click", startGps);
  $("bVoice").addEventListener("click", function () {
    voiceOn = !voiceOn; this.setAttribute("aria-pressed", voiceOn); this.textContent = voiceOn ? "Voice on" : "Voice off";
    if (voiceOn) say(steps[i]);
  });
  var confirmRestart = false, rt = 0;
  $("bDone").addEventListener("click", function () {
    if (!confirmRestart) { confirmRestart = true; this.textContent = "Tap again"; clearTimeout(rt); var b = this; rt = setTimeout(function () { confirmRestart = false; b.textContent = "Restart"; }, 3000); return; }
    confirmRestart = false; this.textContent = "Restart"; go(0, false);
  });
  document.addEventListener("keydown", function (e) { if (e.key === "ArrowRight") go(i + 1); if (e.key === "ArrowLeft") go(i - 1); });
  function wake() { try { if (navigator.wakeLock && document.visibilityState === "visible") navigator.wakeLock.request("screen").catch(function () {}); } catch (e) {} }
  document.addEventListener("visibilitychange", wake); wake();

  if (ROUTES.length > 1) { $("chg").hidden = false; $("chg").addEventListener("click", function () { buildRoutes(); $("routesSheet").hidden = false; }); }
  var firstVisit = sget("drv:last") === null;
  var last = parseInt(sget("drv:last") || "0", 10);
  openRoute(ROUTES.length > 1 && last >= 0 && last < ROUTES.length ? last : 0);
  if (ROUTES.length > 1 && firstVisit) { buildRoutes(); $("routesSheet").hidden = false; }
})();
</script>
</body></html>
